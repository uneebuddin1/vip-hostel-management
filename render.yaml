services:
  - type: web
    name: vip-hostel-online
    runtime: python
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn webapp:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vip-hostel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
  - type: pserv
    name: vip-hostel-db
    runtime: postgres
    plan: free
    databaseName: vip_hostel
    user: vip_hostel
